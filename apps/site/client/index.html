<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Zelare — Cuidado, pedagogia e gestão inteligente</title>
    <meta name="description" content="A plataforma que conecta gestão escolar, pedagogia, cuidado, corpo docente e família em um só lugar. Para instituições públicas e privadas de educação infantil." />
    <link rel="icon" type="image/png" href="/images/zelare-icon-card.png" />
    <link rel="apple-touch-icon" href="/images/zelare-icon-card.png" />
    <meta name="theme-color" content="#0B3B3E" />
    <!-- Google Fonts - Montserrat + Fraunces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Só carrega analytics se o endpoint estiver configurado — evita 404 desnecessário
      if (window.__ANALYTICS_ENDPOINT__ || '%VITE_ANALYTICS_ENDPOINT%'.trim()) {
        const s = document.createElement('script');
        s.defer = true;
        s.src = '%VITE_ANALYTICS_ENDPOINT%/umami';
        s.setAttribute('data-website-id', '%VITE_ANALYTICS_WEBSITE_ID%');
        document.body.appendChild(s);
      }
    </script>
  </body>

</html>
