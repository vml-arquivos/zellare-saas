<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Zelare — cuidado, pedagogia e gestão inteligente" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zelare" />
    <meta name="format-detection" content="telephone=no" />
    <meta id="zelare-theme-color" name="theme-color" content="#0d1117" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('zelare-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored === 'light' || (stored === 'system' && !systemDark) ? 'light' : 'dark';
          const root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          document.getElementById('zelare-theme-color')?.setAttribute('content', theme === 'dark' ? '#0d1117' : '#f6f8fc');
        } catch {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <title>Zelare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
